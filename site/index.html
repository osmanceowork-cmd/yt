<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>YouTube</title>
<style>
  :root { --bg:#0f0f0f; --text:#f1f1f1; --muted:#aaaaaa; --btn:#cc0000; --btn-text:#ffffff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  main { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:24px; padding:24px 16px; text-align:center; }
  p { margin:0; font-size:18px; }
  a.btn { display:block; width:100%; max-width:360px; padding:16px 20px; border-radius:12px;
    background:var(--btn); color:var(--btn-text); font-weight:700; font-size:18px; text-decoration:none; }
  a.btn:focus-visible, a.alt:focus-visible { outline:3px solid #ffffff; outline-offset:3px; }
  a.alt { color:var(--muted); font-size:16px; padding:12px; }
</style>
</head>
<body>
<main>
  <p>YouTube ochilmoqda…</p>
  <a class="btn" id="app" href="https://www.youtube.com/">YouTube ilovasida ochish</a>
  <a class="alt" id="web" href="https://www.youtube.com/">Ilova yo'q bo'lsa, brauzerda ko'rish</a>
</main>
<script>
  // Ustoz YouTube kanalidagi oxirgi video. GitHub Action har 30 daqiqada yangilaydi.
  var ID = "KZgLDfOl2oY";
  var q = new URLSearchParams(location.search).get("v");
  if (q && /^[A-Za-z0-9_-]{11}$/.test(q)) ID = q;

  var web = "https://www.youtube.com/watch?v=" + ID;
  var ua = navigator.userAgent || "";
  var android = /android/i.test(ua);
  var ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var app = android
    ? "intent://www.youtube.com/watch?v=" + ID + "#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=" + encodeURIComponent(web) + ";end"
    : ios ? "youtube://www.youtube.com/watch?v=" + ID : web;

  document.getElementById("app").href = app;
  document.getElementById("web").href = web;

  var left = false;
  function gone() { left = true; }
  document.addEventListener("visibilitychange", function () { if (document.hidden) gone(); });
  window.addEventListener("pagehide", gone);
  window.addEventListener("blur", gone);

  location.href = app;
  if (app !== web) setTimeout(function () { if (!left && !document.hidden) location.href = web; }, 2000);
</script>
</body>
</html>
