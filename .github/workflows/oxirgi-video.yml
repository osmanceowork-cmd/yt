name: oxirgi-video
on:
  push:
    branches: [main]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  yangilash:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - id: tekshir
        env:
          PLAYLIST: UULF2nlnWxJcIObNOgkzckt9WA   # @usmon_dostonov, faqat uzun videolar (Shorts'siz)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ID=$(curl -fsSL --retry 3 "https://www.youtube.com/feeds/videos.xml?playlist_id=$PLAYLIST" | grep -o '<yt:videoId>[A-Za-z0-9_-]\{11\}' | head -1 | cut -d'>' -f2) || true
          CUR=$(grep -o 'var ID = "[A-Za-z0-9_-]\{11\}"' site/index.html | cut -d'"' -f2)
          echo "joriy=$CUR yangi=$ID"
          CHANGED=false
          if [ ${#ID} -eq 11 ] && [ "$ID" != "$CUR" ]; then
            sed -i "s/var ID = \"$CUR\"/var ID = \"$ID\"/" site/index.html
            git commit -am "Oxirgi video: $ID" && git push && CHANGED=true
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 4320000 ]; then
            date -u > .keepalive && git add .keepalive && git commit -m "keepalive" && git push
          fi
          if [ "$CHANGED" = true ] || [ "$GITHUB_EVENT_NAME" != "schedule" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; else echo "deploy=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.tekshir.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.tekshir.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.tekshir.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
